# ---------------------------------------------------------------------------
# RealitySync — local development stack
#
#   cp .env.example .env
#   docker compose up
#
# Services start in dependency order and wait on health, so `docker compose up`
# reaching a healthy state means the whole foundation is genuinely working.
# ---------------------------------------------------------------------------

name: realitysync

services:
  postgres:
    image: postgres:16-alpine
    container_name: realitysync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realitysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-realitysync}
      # Deterministic collation, so ordering is identical across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realitysync} -d ${POSTGRES_DB:-realitysync}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # Disposable SOURCE database — test infrastructure, not product data.
  #
  # Stands in for a customer's PostgreSQL during development: a separate
  # server, reached over TCP with TLS, using credentials supplied through the
  # UI like any other source. Nothing in the application has privileged access
  # to it, and it holds no RealitySync data.
  #
  # Empty by default. Put your own tables in it, or point RealitySync at a real
  # external database instead — see docs/phase-3-postgres-connector.md.
  # -------------------------------------------------------------------------
  source-postgres:
    build:
      context: ./infra/test-source-postgres
    container_name: realitysync-source-postgres
    profiles: ["dev-source"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER:-source_owner}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB:-source_demo}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${SOURCE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - source_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_POSTGRES_USER:-source_owner} -d ${SOURCE_POSTGRES_DB:-source_demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Second *source* type. Test infrastructure, not product data — see the
  # Dockerfile. Exists so "a new connector needs no downstream changes" is
  # demonstrated against a real server rather than asserted.
  source-mysql:
    build:
      context: ./infra/test-source-mysql
    container_name: realitysync-source-mysql
    profiles: ["dev-source"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SOURCE_MYSQL_ROOT_PASSWORD:-change-me-locally}
      MYSQL_DATABASE: ${SOURCE_MYSQL_DB:-source_demo}
    ports:
      - "${SOURCE_MYSQL_PORT:-3308}:3306"
    volumes:
      - source_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${SOURCE_MYSQL_ROOT_PASSWORD:-change-me-locally}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: realitysync-redis
    restart: unless-stopped
    # No persistence: Redis holds nothing authoritative, so an empty restart is
    # always safe (Phase 0 §20).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: realitysync-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-realitysync}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-realitysync}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: realitysync-api
    restart: unless-stopped
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-realitysync}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-realitysync}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_NAME: ${COOKIE_NAME:-rs_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-change-me}
      # On by default, including locally: a limiter that is only exercised in
      # production is one nobody has actually tested. It fails open, so a
      # stopped redis container degrades it rather than blocking sign-in.
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      # Docker service addresses are private by definition, so the dev stack
      # opts in. Production leaves this off, which is the default: without it a
      # tenant can aim a connector at internal infrastructure.
      CONNECTOR_ALLOW_PRIVATE_HOSTS: ${CONNECTOR_ALLOW_PRIVATE_HOSTS:-true}
      # Background syncing. On by default so the scheduled path is the one
      # exercised during development, rather than a code path that only ever
      # runs in production.
      SYNC_SCHEDULER_ENABLED: ${SYNC_SCHEDULER_ENABLED:-true}
      SYNC_SCHEDULER_TICK_SECONDS: ${SYNC_SCHEDULER_TICK_SECONDS:-30}
      # Validated at startup; the process refuses to boot if it is unusable.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-cmVhbGl0eXN5bmMtZGV2ZWxvcG1lbnQta2V5LW9ubHk=}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Live reload during development. Bind-mounting source only; the
      # installed dependencies stay in the image.
      - ./apps/api/app:/srv/api/app:ro
      - ./apps/api/alembic:/srv/api/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: realitysync-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/srv/web/src
      - ./apps/web/public:/srv/web/public
      # Keep container-installed node_modules and build cache out of the host.
      - web_node_modules:/srv/web/node_modules
      - web_next_cache:/srv/web/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  source_mysql_data:
  source_postgres_data:
  web_node_modules:
  web_next_cache:
