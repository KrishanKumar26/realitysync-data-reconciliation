[project]
name = "realitysync-api"
version = "0.1.0"
description = "RealitySync API — the reality layer for autonomous systems"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    # Argon2id password hashing. Used directly rather than through passlib:
    # passlib is effectively unmaintained and its bcrypt backend breaks against
    # current bcrypt releases. argon2-cffi is the reference implementation.
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    # AES-256-GCM for credential encryption at rest. The reference Python
    # implementation; no hand-rolled crypto anywhere in this codebase.
    "cryptography>=44.0.0",
    # MySQL connector driver. Pure-Python (PyMySQL underneath), so it needs no
    # build toolchain in the container, and it accepts an ssl.SSLContext
    # directly — which is what lets the TLS policy be expressed explicitly
    # rather than through driver-specific flags.
    "aiomysql>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# async correctness
    "S",    # bandit security
    "T20",  # no print statements
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["E402"]

# ---------------------------------------------------------------------------
# Mypy — strict typing (Phase 0 §38: "Use Python type hints")
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# aiomysql ships no type information. Narrowed to that one module rather than
# relaxed globally, so everything else stays strictly checked.
[[tool.mypy.overrides]]
module = ["aiomysql.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis to be running",
]
