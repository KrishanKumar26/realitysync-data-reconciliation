name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realitysync
          POSTGRES_PASSWORD: realitysync
          POSTGRES_DB: realitysync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U realitysync"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://realitysync:realitysync@localhost:5432/realitysync
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy strict)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests (unit + integration)
        run: pytest -q

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: ci

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      # Deliberately not using `--wait`: the migrate service is a one-shot
      # container that exits 0, and `--wait` semantics around completed
      # containers vary by Compose version. Polling the health endpoint tests
      # the thing we actually care about.
      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API liveness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API live after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "API did not become live within 600s"; exit 1

      - name: Verify liveness payload
        run: curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Verify readiness with live dependencies
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sS http://localhost:8000/ready || true)
            case "$body" in
              *'"status":"ready"'*) echo "$body"; exit 0 ;;
            esac
            sleep 5
          done
          echo "Readiness never reported ready. Last body: $body"; exit 1

      - name: Verify migration was applied
        run: |
          docker compose exec -T postgres \
            psql -U realitysync -d realitysync -tAc \
            "SELECT version_num FROM alembic_version" | grep -q .

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
