# Host-based authentication for the disposable source database.
#
# Every TCP rule is `hostssl`, and a final `hostnossl ... reject` makes the
# refusal explicit rather than implicit. An unencrypted connection attempt is
# rejected by the server, so the connector's own TLS requirement is not the
# only thing standing between this database and a plaintext session.

# Local socket connections, used by pg_isready and the entrypoint's initdb step.
local   all   all                 trust

# Refuse unencrypted TCP outright.
hostnossl all all 0.0.0.0/0       reject
hostnossl all all ::/0            reject

# Encrypted TCP, password authenticated.
hostssl all all 0.0.0.0/0         scram-sha-256
hostssl all all ::/0              scram-sha-256
